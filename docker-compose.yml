version: '3.9'

services:

  frontend:
    image: ghcr.io/atek0/smul2-frontend:latest
    # Para desenvolvimento local, usa build em vez de image:
    # build:
    #   context: ./Portal/Portal
    ports:
      - "8080:80"       # Ajusta a porta exposta pelo ASP.NET
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - BACKEND_URL=http://backend:8000   # URL interna do microserviço
      - ConnectionStrings__DefaultConnection=Server=mysql_db;Port=3306;Database=dec;User=root;Password=${MYSQL_ROOT_PASSWORD:-root};
    depends_on:
      - backend
      - mysql_db
    restart: unless-stopped

  backend:
    image: ghcr.io/atek0/smul2-backend:latest
    # Para desenvolvimento local:
    # build:
    #   context: ./MS-CAFIN/calc_service
    ports:
      - "8000:8000"
    volumes:
      - django_data:/app/data
    environment:
      - DJANGO_SETTINGS_MODULE=calc_service.settings   # Ajusta para o teu módulo
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
    restart: unless-stopped
    command: gunicorn calc_service.wsgi:application --bind 0.0.0.0:8000

  mysql_db:
    image: mysql:8.0
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=dec
    restart: unless-stopped

volumes:
  mysql_data:
  django_data:
