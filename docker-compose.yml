services:

  # --- AMBIENTE MAIN (PRODUÇÃO / Development) ---
  frontend-main:
    image: ghcr.io/atek0/smul2-frontend:latest
    profiles: ["main"]
    ports:
      - "8080:80"       # Porta para a main
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - BACKEND_URL=http://backend-main:8000
      - ConnectionStrings__DefaultConnection=Server=mysql_db;Port=3306;Database=dec;User=root;Password=${MYSQL_ROOT_PASSWORD:-root};
    depends_on:
      - backend-main
      - mysql_db
    restart: unless-stopped

  backend-main:
    image: ghcr.io/atek0/smul2-backend:latest
    profiles: ["main"]
    ports:
      - "8000:8000"
    volumes:
      - django_data_main:/app/data
    environment:
      - DJANGO_SETTINGS_MODULE=calc_service.settings
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
    restart: unless-stopped
    command: gunicorn calc_service.wsgi:application --bind 0.0.0.0:8000

  # --- AMBIENTE DEVELOP (TESTES / DESENVOLVIMENTO) ---
  frontend-develop:
    image: ghcr.io/atek0/smul2-frontend:develop
    profiles: ["develop"]
    ports:
      - "8081:80"       # Porta diferente para a develop
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - BACKEND_URL=http://backend-develop:8001
      - ConnectionStrings__DefaultConnection=Server=mysql_db;Port=3306;Database=dec;User=root;Password=${MYSQL_ROOT_PASSWORD:-root};
    depends_on:
      - backend-develop
      - mysql_db
    restart: unless-stopped

  backend-develop:
    image: ghcr.io/atek0/smul2-backend:develop
    profiles: ["develop"]
    ports:
      - "8001:8000"     # Porta diferente para a develop
    volumes:
      - django_data_dev:/app/data
    environment:
      - DJANGO_SETTINGS_MODULE=calc_service.settings
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=True
    restart: unless-stopped
    command: gunicorn calc_service.wsgi:application --bind 0.0.0.0:8000

  # --- BASE DE DADOS PARTILHADA ---
  mysql_db:
    image: mysql:8.0
    profiles: ["main", "develop"]
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=dec
    restart: unless-stopped

volumes:
  mysql_data:
  django_data_main:
  django_data_dev:
