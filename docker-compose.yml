services:

  # ============================================================
  # REVERSE PROXY — Nginx com TLS
  # ============================================================

  # --- Nginx para o ambiente MAIN (portas 80/443) ---
  nginx-main:
    image: nginx:alpine
    profiles: ["main"]
    ports:
      - "80:80"        # HTTP → redirect para HTTPS
      - "443:443"      # HTTPS (TLS termination)
    volumes:
      - ./nginx/main.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend-main
      - backend-main
    restart: unless-stopped

  # --- Nginx para o ambiente DEVELOP (portas 8080/8443) ---
  nginx-develop:
    image: nginx:alpine
    profiles: ["develop"]
    ports:
      - "8080:80"      # HTTP → redirect para HTTPS
      - "8443:443"     # HTTPS (TLS termination)
    volumes:
      - ./nginx/develop.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend-develop
      - backend-develop
    restart: unless-stopped

  # ============================================================
  # AMBIENTE MAIN (PRODUÇÃO)
  # ============================================================

  frontend-main:
    # image: ghcr.io/atek0/smul2-frontend:latest
    build: ./Portal/Portal
    profiles: ["main"]
    # Sem portas expostas — acessível apenas via nginx-main
    expose:
      - "80"
    environment:
      - ASPNETCORE_URLS=http://+:80 
      - ASPNETCORE_ENVIRONMENT=Production
      - BACKEND_URL=http://backend-main:8000
      - "ConnectionStrings__DefaultConnection=Server=mysql_db;Port=3306;Database=dec;User=root;Password=${MYSQL_ROOT_PASSWORD:-root};"
    depends_on:
      - backend-main
      - mysql_db
    restart: unless-stopped

  backend-main:
    # image: ghcr.io/atek0/smul2-backend:latest
    build: ./MS-CAFIN/calc_service
    profiles: ["main"]
    # Sem portas expostas — acessível apenas via nginx-main
    expose:
      - "8000"
    environment:
      - DJANGO_SETTINGS_MODULE=calc_service.settings
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      # Ligação à base de dados MySQL partilhada
      - DB_HOST=mysql_db
      - DB_PORT=3306
      - DB_NAME=calc_service
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
    depends_on:
      - mysql_db
    restart: unless-stopped
    command: >-
      sh -c "python manage.py migrate --noinput &&
             gunicorn calc_service.wsgi:application --bind 0.0.0.0:8000"

  # ============================================================
  # AMBIENTE DEVELOP (TESTES / DESENVOLVIMENTO)
  # ============================================================

  frontend-develop:
    # image: ghcr.io/atek0/smul2-frontend:develop
    build: ./Portal/Portal
    profiles: ["develop"]
    # Sem portas expostas — acessível apenas via nginx-develop
    expose:
      - "80"
    environment:
      - ASPNETCORE_URLS=http://+:80 
      - ASPNETCORE_ENVIRONMENT=Development
      - BACKEND_URL=http://backend-develop:8000
      - "ConnectionStrings__DefaultConnection=Server=mysql_db;Port=3306;Database=dec;User=root;Password=${MYSQL_ROOT_PASSWORD:-root};"
    depends_on:
      - backend-develop
      - mysql_db
    restart: unless-stopped

  backend-develop:
    # image: ghcr.io/atek0/smul2-backend:develop
    build: ./MS-CAFIN/calc_service
    profiles: ["develop"]
    # Sem portas expostas — acessível apenas via nginx-develop
    expose:
      - "8000"
    environment:
      - DJANGO_SETTINGS_MODULE=calc_service.settings
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=True
      # Ligação à base de dados MySQL partilhada
      - DB_HOST=mysql_db
      - DB_PORT=3306
      - DB_NAME=calc_service
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
    depends_on:
      - mysql_db
    restart: unless-stopped
    command: >-
      sh -c "python manage.py migrate --noinput &&
             gunicorn calc_service.wsgi:application --bind 0.0.0.0:8000"

  # ============================================================
  # BASE DE DADOS PARTILHADA
  # ============================================================

  mysql_db:
    image: mysql:8.0
    profiles: ["main", "develop"]
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=dec
    restart: unless-stopped

volumes:
  mysql_data:
